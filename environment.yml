name: drefnet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pytorch=2.2.2
  - torchvision=0.17.2
  - pytorch-cuda=11.8
  - numpy=1.24.4
  - scipy
  - pyyaml
  - tqdm
  - h5py
  - numba
  - matplotlib
  - pillow
  - opencv=4.10.0
  - pycocotools
  - seaborn
  - pip:
      - --extra-index-url=https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-11/pypi/simple/
      - torch-geometric==2.5.3
      - hdf5plugin
      - onnxruntime-gpu
